<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | {{ site.site_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
</head>
<body class="login-body">
  <div class="login-bg" aria-hidden="true"><span></span><span></span><span></span></div>
  <main class="login-card">
    <div class="login-brand">
      {% if site.logo %}<img src="{{ url_for('static', filename='uploads/' ~ site.logo) }}" alt="">{% else %}<span class="mark">{{ site.site_name[:1] }}</span>{% endif %}
      <h1>{{ site.site_name }}</h1>
      <p>Owner login</p>
    </div>

    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="flash flash-{{ cat }}">{{ m }}</div>{% endfor %}
    {% endwith %}

    <form method="post" class="stack">
      <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
      <label>Username<input name="username" required autofocus autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn btn-primary" type="submit">Log in</button>
    </form>
    <a class="back" href="{{ url_for('index') }}">&larr; Back to website</a>
  </main>
</body>
</html>
